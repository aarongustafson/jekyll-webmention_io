name: "Run RSpec Tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # 3.1 is the floor the dev toolchain allows (html-proofer 5.x needs >= 3.1),
        # but it's EOL, so we start at 3.2. 'head' (Ruby 4.x dev) is a canary.
        ruby-version: ['3.2', '3.3', '3.4', '4.0']
        include:
          - ruby-version: 'head'
            experimental: true

    steps:
    - uses: actions/checkout@v5

    - name: Install Chrome dependencies (for Cuprite/Ferrum)
      run: sudo apt-get update && sudo apt-get install -y libgbm-dev

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}

    - name: Install dependencies
      run: bundle install

    - name: Run tests with coverage
      run: bundle exec rake coverage
      env:
        COVERAGE: 'true'

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-ruby-${{ matrix.ruby-version }}
        path: coverage/
        retention-days: 30
